<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brain Tumor Detection AI</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>

<div class="background"></div>

<div class="container">

    <div class="header">

        <h1>🧠 Brain Tumor Detection</h1>

        <p>
            AI-Powered MRI Analysis using Deep Learning & Explainable AI (Grad-CAM)
        </p>

    </div>


    <div class="upload-card">

        <input type="file" id="imageInput">

        <button onclick="uploadImage()">
            🔍 Analyze MRI
        </button>

    </div>


    <div class="cards">

        <div class="card">

            <h2>Uploaded MRI</h2>

            <img id="preview">

        </div>

        <div class="card">

            <h2>Prediction Result</h2>

            <div class="result-box">

                <h1 id="result">Waiting...</h1>

                <div class="progress">

                    <div id="confidence-fill"></div>

                </div>

                <p id="confidence-text">Confidence: 0%</p>

            </div>

        </div>

    </div>


    <div class="heatmap-card">

        <h2>🧠 Explainable AI (Grad-CAM)</h2>

        <img id="heatmap">

    </div>


    <footer>

        Developed using CNN • MobileNetV2 • Flask • Grad-CAM

    </footer>

</div>

<script src="script.js"></script>

</body>

</html>
